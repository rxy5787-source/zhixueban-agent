name: Export sanitized main source ZIP
on:
  push:
    branches:
      - export/sanitized-main-20261115
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pinned main commit
        uses: actions/checkout@v4
        with:
          ref: d76e9e8d675ab4df5e7e4ab39ef44e1eea62e825
          persist-credentials: false
      - name: Create sanitized source ZIP
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import re
          import subprocess
          import zipfile
          import io
          root=Path(".")
          out=Path("zhixueban-agent-main-sanitized.zip")
          patterns=[
              re.compile(rb"-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----"),
              re.compile(rb"\bghp_[A-Za-z0-9]{25,}\b"),
              re.compile(rb"\bgithub_pat_[A-Za-z0-9_]{40,}\b"),
              re.compile(rb"\bsk-[A-Za-z0-9_-]{30,}\b"),
              re.compile(rb"\bAIza[0-9A-Za-z_-]{35}\b"),
          ]
          excluded_ext={".pem",".p12",".pfx",".jks",".keystore",".kdbx",".p8"}
          excluded_names={"local.properties","id_rsa","id_ed25519","credentials.json",
              "secrets.json","service-account.json","service_account.json"}
          all_paths=subprocess.check_output(["git","ls-files","-z"]).split(b"\0")
          included=0
          excluded=[]
          with zipfile.ZipFile(out,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=7) as z:
              for raw_path in all_paths:
                  if not raw_path:
                      continue
                  name=raw_path.decode("utf-8","surrogateescape")
                  p=PurePosixPath(name)
                  if p.is_absolute() or ".." in p.parts:
                      excluded.append(name)
                      continue
                  if any(part==".env" or part.startswith(".env.") for part in p.parts):
                      excluded.append(name)
                      continue
                  if p.name.lower() in excluded_names or p.suffix.lower() in excluded_ext:
                      excluded.append(name)
                      continue
                  path=root/name
                  if not path.is_file() or path.is_symlink():
                      excluded.append(name)
                      continue
                  b=path.read_bytes()
                  if any(pattern.search(b) for pattern in patterns):
                      excluded.append(name)
                      continue
                  z.writestr("zhixueban-agent/"+name,b)
                  included+=1
              z.writestr("zhixueban-agent/EXPORT_INFO.txt",
                  "Source repository: rxy5787-source/zhixueban-agent\n"
                  "Source branch: main\n"
                  "Source commit: d76e9e8d675ab4df5e7e4ab39ef44e1eea62e825\n"
                  "All .env and .env.* files are excluded; .git history is not included.\n")
          assert included>100, "Unexpectedly incomplete archive"
          with zipfile.ZipFile(out) as z:
              names=z.namelist()
              assert len(names)==included+1
              assert not any("/.env" in n or n.endswith("/.env") or "/.git/" in n for n in names)
              assert z.testzip() is None
          print("Included tracked files:",included)
          print("Excluded file paths:",excluded)
          print("ZIP bytes:",out.stat().st_size)
          PY
      - name: Upload sanitized ZIP
        uses: actions/upload-artifact@v4
        with:
          name: zhixueban-agent-main-sanitized
          path: zhixueban-agent-main-sanitized.zip
          retention-days: 2
          if-no-files-found: error
