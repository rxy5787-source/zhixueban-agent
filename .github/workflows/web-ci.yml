name: Web CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build Web and test Python API
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-prototype/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python-ai/requirements.txt

      - name: Build Web
        working-directory: web-prototype
        run: |
          node --version
          npm --version
          npm ci --no-audit --no-fund
          npm run build

      - name: Install Python dependencies
        run: |
          python --version
          python -m pip install -r python-ai/requirements.txt
          python -m pip check

      - name: Package backend and run API tests
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'zhixueban-ci.zip'
          $package = Join-Path $env:RUNNER_TEMP 'zhixueban-ci'
          & ./web-prototype/deploy/prepare.ps1 -PythonProject (Resolve-Path python-ai).Path -OutputZip $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $package
          $env:PYTHONPATH = Join-Path $package 'server'
          python -m pytest -q web-prototype/deploy/test_web_trial.py

  python-unit:
    name: Python unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        # Same pins as python-ai/requirements.txt; the unit tests need no model, OCR or web stack.
        run: python -m pip install requests==2.34.2 pydantic==2.14.1 pytest==9.1.1
      - name: Run unit tests
        working-directory: python-ai
        run: python -m pytest -q
