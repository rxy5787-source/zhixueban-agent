name: Phase 38 Safe internal errors

on:
  push:
    branches:
      - feat/phase38-safe-internal-errors-20261117
    paths:
      - 'python-ai/**'
      - 'web-prototype/**'
      - '.github/workflows/phase38-safe-internal-errors.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Agent + safe errors and trace correlation
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-prototype/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python-ai/requirements.txt
      - name: Build web
        working-directory: web-prototype
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install Python requirements
        run: |
          python -m pip install -r python-ai/requirements.txt
          python -m pip check
      - name: Test agent audit and learning planner
        shell: pwsh
        run: |
          $env:PYTHONPATH = "python-ai"
          python -m pytest -q python-ai/test_agent_runtime.py python-ai/test_weak_points_skill.py python-ai/test_study_skill_planner.py
      - name: Run imported deterministic enterprise unit tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "python-ai"
          python -m pytest -q python-ai/tests/test_job_store.py python-ai/tests/test_literal_evidence.py python-ai/tests/test_practice_quality.py python-ai/tests/test_validator_gates.py
      - name: Test packaged Web API
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'zhixueban-ci.zip'
          $package = Join-Path $env:RUNNER_TEMP 'zhixueban-ci'
          & ./web-prototype/deploy/prepare.ps1 -PythonProject (Resolve-Path python-ai).Path -OutputZip $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $package
          $env:PYTHONPATH = Join-Path $package 'server'
          python -m pytest -q web-prototype/deploy/test_web_trial.py
