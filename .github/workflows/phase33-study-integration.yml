name: Phase 33 study integration gate

on:
  push:
    branches:
      - test/phase33-study-api-integration-gate-20261116
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase33:
    name: Study Skill + authorized Web API integration
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-prototype/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python-ai/requirements.txt
      - name: Build Web frontend
        working-directory: web-prototype
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install and validate Python dependencies
        run: |
          python -m pip install -r python-ai/requirements.txt
          python -m pip check
      - name: Test Agent Skill contracts and study planner
        shell: pwsh
        run: |
          $env:PYTHONPATH = "python-ai"
          python -m pytest -q python-ai/test_agent_runtime.py python-ai/test_weak_points_skill.py python-ai/test_study_skill_planner.py python-ai/test_phase33_study_integration.py
      - name: Verify packaged trial Web API
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'zhixueban-phase33.zip'
          $package = Join-Path $env:RUNNER_TEMP 'zhixueban-phase33'
          & ./web-prototype/deploy/prepare.ps1 -PythonProject (Resolve-Path python-ai).Path -OutputZip $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $package
          $env:PYTHONPATH = Join-Path $package 'server'
          python -m pytest -q web-prototype/deploy/test_web_trial.py
