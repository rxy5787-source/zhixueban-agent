name: Apply reviewed ZIP changes
on:
  push:
    branches:
      - import/reviewed-updated-source-20261115
permissions:
  contents: write
jobs:
  apply-reviewed:
    if: contains(github.event.head_commit.message, 'apply reviewed ZIP patch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated import branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Verify and apply source patch (no model or network execution)
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/import/zhixueban_reviewed_patch.b64 | gzip --decompress > /tmp/reviewed-source.patch
          echo "cd56e0439da7af1923a6e641e57fd2ada62bc7e5fc92016bd5d57ae2efedbc29  /tmp/reviewed-source.patch" | sha256sum --check
          git apply --check /tmp/reviewed-source.patch
          git apply --index /tmp/reviewed-source.patch
          git rm .github/import/zhixueban_reviewed_patch.b64 .github/workflows/apply-reviewed-zip.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test: add evidence-gate unit tests and format Python code'
          git push origin HEAD:import/reviewed-updated-source-20261115
