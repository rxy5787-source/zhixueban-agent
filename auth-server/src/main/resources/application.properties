spring.application.name=zhixue-auth
server.port=${AUTH_PORT:8087}
server.address=${AUTH_BIND_ADDRESS:127.0.0.1}
spring.datasource.url=${AUTH_DATABASE_URL:jdbc:h2:file:./data/accounts;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${AUTH_DATABASE_USER:sa}
spring.datasource.password=${AUTH_DATABASE_PASSWORD:}
spring.sql.init.mode=always
spring.h2.console.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=none
server.tomcat.threads.max=32
server.tomcat.max-connections=128
server.tomcat.connection-timeout=10s
auth.session-seconds=${AUTH_SESSION_SECONDS:604800}
spring.jackson.deserialization.fail-on-unknown-properties=true
